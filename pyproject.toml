[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ossie-trino"
version = "0.1.0"
description = "Fail-closed Apache Ossie semantic compiler and gateway for Trino"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.18,<5"]

[project.optional-dependencies]
yaml = ["PyYAML>=6"]

[project.scripts]
ossie-trino = "ossie_trino.cli:main"
ossie-gateway = "ossie_trino.gateway:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ossie_trino = ["ossie-schema-0.3.json"]
